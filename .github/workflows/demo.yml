name: Demo contracts and public build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workstations/visual-presentation/production/threejs-first-encounter/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workstations/visual-presentation/production/threejs-first-encounter/app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --test ../../design-capture/capture.test.mjs
      - run: npm run assets
      - run: npm run build
